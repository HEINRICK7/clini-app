name: clini-${CLINI_ENV:-homolog}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clini}
      POSTGRES_USER: ${POSTGRES_USER:-clini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - clini-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - clini-redis-data:/data

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set by the deploy workflow}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clini}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-clini}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      CLINI_AUTH_BOOTSTRAP_EMAIL: ${CLINI_AUTH_BOOTSTRAP_EMAIL:-}
      CLINI_AUTH_BOOTSTRAP_PASSWORD: ${CLINI_AUTH_BOOTSTRAP_PASSWORD:-}
      CLINI_AUTH_BOOTSTRAP_ENABLED: ${CLINI_AUTH_BOOTSTRAP_ENABLED:-false}
      CLINI_ADMIN_BOOTSTRAP_EMAIL: ${CLINI_ADMIN_BOOTSTRAP_EMAIL:-}
      CLINI_ADMIN_BOOTSTRAP_NAME: ${CLINI_ADMIN_BOOTSTRAP_NAME:-Carlos Henrique}
      CLINI_ADMIN_BOOTSTRAP_PASSWORD: ${CLINI_ADMIN_BOOTSTRAP_PASSWORD:-}
      CLINI_ADMIN_BOOTSTRAP_USER_ID: ${CLINI_ADMIN_BOOTSTRAP_USER_ID:-33333333-3333-3333-3333-333333333333}
      CLINI_AUTH_CORS_ALLOWED_ORIGINS: ${CLINI_AUTH_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CLINI_SECURE_COOKIES: ${CLINI_SECURE_COOKIES:-true}
      CLINI_ACTIVATION_BOOTSTRAP_TOKEN: ${CLINI_ACTIVATION_BOOTSTRAP_TOKEN:-}
      CLINI_ACTIVATION_BOOTSTRAP_EMAIL: ${CLINI_ACTIVATION_BOOTSTRAP_EMAIL:-carlos@email.com}
      CLINI_ACTIVATION_BOOTSTRAP_NAME: ${CLINI_ACTIVATION_BOOTSTRAP_NAME:-Dr. Carlos}
      CLINI_ACTIVATION_BOOTSTRAP_TENANT_ID: ${CLINI_ACTIVATION_BOOTSTRAP_TENANT_ID:-22222222-2222-2222-2222-222222222222}
      CLINI_ACTIVATION_BOOTSTRAP_VALIDITY_HOURS: ${CLINI_ACTIVATION_BOOTSTRAP_VALIDITY_HOURS:-72}
      CLINI_STORAGE_ATTACHMENTS_ROOT: /var/lib/clini/attachments
      CLINI_EMAIL_PROVIDER: ${CLINI_EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_REPLY_TO_EMAIL: ${RESEND_REPLY_TO_EMAIL:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      APP_URL: ${APP_URL:-https://app.clini-homolog.otimizanegocio.com}
      CLINI_EMAIL_LOGO_URL: ${CLINI_EMAIL_LOGO_URL:-}
      CLINI_SUPPORT_EMAIL: ${CLINI_SUPPORT_EMAIL:-}
      CLINI_CONTACT_EMAIL: ${CLINI_CONTACT_EMAIL:-}
      CLINI_EMAIL_TEST_RECIPIENT: ${CLINI_EMAIL_TEST_RECIPIENT:-}
      CLINI_EMAIL_TEST_ON_STARTUP: ${CLINI_EMAIL_TEST_ON_STARTUP:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    volumes:
      - clini-attachments:/var/lib/clini/attachments

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set by the deploy workflow}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      CLINI_INTERNAL_API_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://$$(hostname):3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  clini-postgres-data:
  clini-redis-data:
  clini-attachments:
